IdiomaticRails/HandRolledPluralization:
  Description: >-
    Do not pick a singular or plural word by branching on a count.
    String#pluralize does it, and knows the irregular cases.
  Enabled: true
  VersionAdded: '0.1'

IdiomaticRails/InlineStrftime:
  Description: >-
    Define a date format once as a named Date::DATE_FORMATS entry and render
    it with to_fs(:name), rather than repeating a strftime string.
  Enabled: true
  VersionAdded: '0.1'
  # Where a one-off format is the honest answer: a migration, a rake task, a
  # script. Seeds and specs are excluded because a literal there is usually
  # fixture data rather than something a user reads.
  Exclude:
    - 'db/**/*'
    - 'lib/tasks/**/*'
    - 'script/**/*'
    - 'spec/**/*'
    - 'test/**/*'

IdiomaticRails/ManualToSentence:
  Description: >-
    Do not join a list into prose with "and" by hand. Array#to_sentence
    handles the two-item case, the Oxford comma and the locale.
  Enabled: true
  VersionAdded: '0.1'

IdiomaticRails/SpecFixedClockDrift:
  Description: >-
    An example that pins a clock must offset from it, not from the real one.
    Two clocks agree for most of the year and then stop.
  Enabled: true
  VersionAdded: '0.2'
  Include:
    - 'spec/**/*_spec.rb'
    - 'test/**/*_test.rb'

IdiomaticRails/SpecDaylightSavingAbbreviation:
  Description: >-
    A time-zone abbreviation that flips with daylight saving, asserted as a
    literal, is only correct for part of the year.
  Enabled: true
  VersionAdded: '0.2'
  Include:
    - 'spec/**/*_spec.rb'
    - 'test/**/*_test.rb'

IdiomaticRails/SpecSleep:
  Description: >-
    Synchronise on the state that makes the next step possible, rather than
    on a fixed duration.
  Enabled: true
  VersionAdded: '0.2'
  Include:
    - 'spec/**/*.rb'
    - 'test/**/*.rb'
